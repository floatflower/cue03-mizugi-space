services:
  postgres:
    image: postgres:16.3-alpine
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=user
      - POSTGRES_DB=db
      - TZ=UTC
      - PGTZ=UTC
    ports:
      - "39201:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 5s
      timeout: 5s
      retries: 5

  smtp4dev:
    image: rnwood/smtp4dev
    restart: always
    ports:
      - "39205:80"
      - "39206:25"
    volumes:
      - smtp4dev:/smtp4dev

volumes:
  postgres:
  smtp4dev:
